name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build site
        run: |
          export VITE_SITE_URL="${VITE_SITE_URL:-https://skysentineldrone.com}"
          npm run build
        env:
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}

      - name: Verify production build
        run: |
          grep -q '/assets/' dist/index.html
          ! grep -q '/src/main.tsx' dist/index.html

      - name: Load AWS credentials
        env:
          RAW_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          RAW_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          RAW_REGION: ${{ secrets.AWS_REGION }}
        run: |
          trim() {
            printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//"
          }

          KEY_ID="$(trim "$RAW_ACCESS_KEY_ID")"
          SECRET="$(trim "$RAW_SECRET_ACCESS_KEY")"
          REGION="$(trim "${RAW_REGION:-us-east-1}")"
          [ -n "$REGION" ] || REGION="us-east-1"

          if [ -z "$KEY_ID" ] || [ -z "$SECRET" ]; then
            echo "::error::AWS_ACCESS_KEY_ID or AWS_SECRET_ACCESS_KEY is empty. Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

          echo "Access key ID length: ${#KEY_ID} (expected 20)"
          echo "Secret access key length: ${#SECRET} (expected 40)"
          echo "Access key ID prefix: ${KEY_ID:0:4}…"

          if [[ ! "$KEY_ID" =~ ^AKIA[A-Z0-9]{16}$ ]]; then
            echo "::error::AWS_ACCESS_KEY_ID looks wrong. It should start with AKIA and be 20 characters (no quotes/spaces). You may have pasted the secret key into the access key field."
            exit 1
          fi

          if [ "${#SECRET}" -lt 40 ]; then
            echo "::error::AWS_SECRET_ACCESS_KEY looks truncated. Re-create the IAM access key and paste the full secret with no quotes or spaces."
            exit 1
          fi

          echo "::add-mask::$KEY_ID"
          echo "::add-mask::$SECRET"
          {
            echo "AWS_ACCESS_KEY_ID=$KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$SECRET"
            echo "AWS_DEFAULT_REGION=$REGION"
            echo "AWS_REGION=$REGION"
          } >> "$GITHUB_ENV"

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Sync to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          BUCKET="${S3_BUCKET:-sky-sentinel-drone}"

          aws s3 sync dist "s3://${BUCKET}" --delete \
            --cache-control "public, max-age=86400"

          if [ -d dist/assets ]; then
            aws s3 sync dist/assets "s3://${BUCKET}/assets" \
              --cache-control "public, max-age=31536000, immutable"
          fi

          find dist -name '*.html' -print0 | while IFS= read -r -d '' file; do
            key="${file#dist/}"
            aws s3 cp "$file" "s3://${BUCKET}/${key}" \
              --cache-control "max-age=0, no-cache, no-store, must-revalidate" \
              --content-type "text/html; charset=utf-8"
          done

          echo "Deployed to s3://${BUCKET}/"

      - name: Invalidate CloudFront
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -z "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
            echo "CLOUDFRONT_DISTRIBUTION_ID not set — skipping invalidation"
            exit 0
          fi
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
